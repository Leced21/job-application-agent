services:
  applications-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APPLICATIONS_DB_NAME:-applications_db}
      POSTGRES_USER: ${APPLICATIONS_DB_USER:?Set APPLICATIONS_DB_USER locally}
      POSTGRES_PASSWORD: ${APPLICATIONS_DB_PASSWORD:?Set APPLICATIONS_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - applications_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  applications_postgres_data:
