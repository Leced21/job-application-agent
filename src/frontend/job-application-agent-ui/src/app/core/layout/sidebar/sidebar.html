<aside class="sidebar">
  <div class="brand">
    <div class="brand__logo" aria-hidden="true">J</div>
    <div class="brand__content"><strong>JobAgent</strong><span>Votre copilote carrière</span></div>
  </div>

  <nav class="navigation" aria-label="Navigation principale">
    <a routerLink="/dashboard" routerLinkActive="navigation__item--active" [routerLinkActiveOptions]="{ exact: true }" class="navigation__item" title="Tableau de bord" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">⌂</span><span class="navigation__label">Tableau de bord</span>
    </a>
    <a routerLink="/recommendations" routerLinkActive="navigation__item--active" class="navigation__item" title="Recommandations" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">◇</span><span class="navigation__label">Recommandations</span>
    </a>
    <a routerLink="/jobs" routerLinkActive="navigation__item--active" class="navigation__item" title="Offres d’emploi" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">⌕</span><span class="navigation__label">Offres d’emploi</span>
    </a>
    <a routerLink="/documents" routerLinkActive="navigation__item--active" class="navigation__item" title="Mes CV et documents" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">▤</span><span class="navigation__label">Mes CV</span>
    </a>
    <a routerLink="/preparations" routerLinkActive="navigation__item--active" class="navigation__item" title="Préparations de candidature" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">▣</span><span class="navigation__label">Préparations</span>
    </a>
    <a routerLink="/applications" routerLinkActive="navigation__item--active" class="navigation__item" title="Suivi des candidatures" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">✓</span><span class="navigation__label">Candidatures</span>
    </a>
    <a routerLink="/agents" routerLinkActive="navigation__item--active" class="navigation__item" title="Configuration des agents IA" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">✦</span><span class="navigation__label">Agents IA</span>
    </a>
    <a routerLink="/profile" routerLinkActive="navigation__item--active" class="navigation__item" title="Mon profil" (click)="navigationClicked.emit()">
      <span class="navigation__icon" aria-hidden="true">○</span><span class="navigation__label">Mon profil</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <section class="profile-tip" aria-labelledby="profile-tip-title">
      <span class="profile-tip__icon" aria-hidden="true">✦</span>
      <strong id="profile-tip-title">Un profil à jour, des pistes plus pertinentes.</strong>
      <p>Ajoutez vos compétences et vos préférences pour affiner les recommandations.</p>
      <a routerLink="/profile" (click)="navigationClicked.emit()">Mettre à jour mon profil <span aria-hidden="true">→</span></a>
    </section>
  </div>
</aside>
