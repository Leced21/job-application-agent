version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/**"
      - "/tests/**"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/src/frontend/job-application-agent-ui"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - "/src/**"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
